        <h1>CentralObra - Portal de Engenharia, Calculadoras e Gestão de Obras</h1>
        <p>Bem-vindo ao maior portal de ferramentas para a construção civil. O CentralObra oferece um conjunto completo de calculadoras online gratuitas para você estimar com precisão a quantidade de materiais necessários para sua obra ou reforma. Pare de desperdiçar dinheiro com sobras de materiais.</p>
        <h2>Nossas Ferramentas:</h2>
        <ul>
          <li><strong>Calculadora de Concreto e Argamassa:</strong> Descubra a quantidade exata de cimento, areia e brita para qualquer traço, seja para fundações, lajes ou reboco.</li>
          <li><strong>Calculadora de Alvenaria:</strong> Quantos tijolos baianos ou blocos estruturais por metro quadrado (m²)? Calcule instantaneamente, já com margem de quebra e argamassa de assentamento.</li>
          <li><strong>Calculadora de Pisos e Porcelanatos:</strong> Saiba quantos metros quadrados (m²) de revestimento comprar e qual a quantidade ideal de argamassa AC-II e AC-III.</li>
          <li><strong>Calculadora de Pintura:</strong> Insira a metragem das suas paredes e saiba quantos galões de tinta e litros de massa corrida serão utilizados no acabamento.</li>
        </ul>
        <p>Além das ferramentas abertas ao público, oferecemos uma plataforma robusta de gestão. Construtores, engenheiros, arquitetos e pedreiros autônomos podem gerar orçamentos comerciais profissionais em PDF, acompanhar o cronograma físico-financeiro e acessar uma rede de profissionais locais.</p>
